plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '3.2.2'
}

group = 'org.beckn'
version = '1.0.0-SNAPSHOT'
description = 'Beckn Seeker Notifier Job'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM for version management
    implementation platform('org.testcontainers:testcontainers-bom:1.19.3')
    
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Retry functionality
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka:3.1.0'
    implementation 'org.apache.kafka:kafka-clients:3.6.0'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Beckn Auth SDK (composite build — signing via Ed25519 + BLAKE-512)
    implementation 'org.beckn:beckn-auth-sdk'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Structured logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Utils
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

test {
    useJUnitPlatform()
    // Increase timeout for integration tests with Testcontainers
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

jacoco {
    toolVersion = "0.8.12"
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

springBoot {
    mainClass = 'org.beckn.seeker.SeekerNotifierApplication'
}

bootJar {
    archiveFileName = 'seeker-notifier-1.0.0-SNAPSHOT.jar'
    exclude('**/lombok/**')
    layered {
        enabled = true
    }
}
