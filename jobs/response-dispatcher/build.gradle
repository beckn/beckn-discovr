plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '3.2.2'
}

group = 'org.beckn'
version = '1.0.0-SNAPSHOT'
description = 'Beckn Seeker Notifier Job'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Security overrides for transitive CVEs (bump Spring Boot BOM-managed versions).
// jackson → CVE-2026-54515 · logback → CVE-2026-10532 · commons-lang3 → CVE-2025-48924
ext['jackson-bom.version'] = '2.21.5'
ext['logback.version'] = '1.5.35'
ext['commons-lang3.version'] = '3.18.0'

repositories {
    mavenCentral()
}

dependencies {
    // Testcontainers version is managed by the Spring Boot BOM.
    // (An explicit 1.19.3 pin shipped docker-java built against the removed
    //  org.apache.commons.codec.Charsets API, which breaks against the
    //  commons-codec version Spring Boot 3.5.x now resolves.)

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Retry functionality
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Kafka (versions managed by Spring Boot BOM)
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'

    // JSON Processing (jackson-core provided transitively by jackson-databind)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Beckn Auth SDK (composite build — signing via Ed25519 + BLAKE-512)
    // BouncyCastle (bcprov) is provided transitively by the auth SDK — no direct use here.
    implementation 'org.beckn:beckn-auth-sdk'

    // Metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Structured logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Utils
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // docker-java (Testcontainers) needs commons-codec at runtime; it is not otherwise
    // on this job's test classpath. Version managed by the Spring Boot BOM.
    testImplementation 'commons-codec:commons-codec'

    // Transitive CVE constraint — commons-compress (via testcontainers), CVE-2024-25710
    constraints {
        testImplementation 'org.apache.commons:commons-compress:1.26.0'
    }
}

test {
    useJUnitPlatform()
    // Increase timeout for integration tests with Testcontainers
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

jacoco {
    toolVersion = "0.8.12"
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

springBoot {
    mainClass = 'org.beckn.seeker.SeekerNotifierApplication'
}

bootJar {
    archiveFileName = 'seeker-notifier-1.0.0-SNAPSHOT.jar'
    exclude('**/lombok/**')
    layered {
        enabled = true
    }
}
