spring:
  application:
    name: response-dispatcher

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seeker-notifier-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      properties:
        retry.backoff.ms: 1000
        delivery.timeout.ms: 120000
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 1
      type: SINGLE
      missing-topics-fatal: false

topics:
  input: discovr.discover.out.responses
  dlt: discovr.dispatcher.dlt.responses

kafka:
  topics:
    partitions: ${KAFKA_TOPICS_PARTITIONS:4}
    dlt-partitions: ${KAFKA_DLT_PARTITIONS:1}
    replication-factor: 1

# HTTP client configuration for BAP notifications
http:
  client:
    timeout: 30000
    connection-timeout: 10000
    url-validation-enabled: ${CALLBACK_URL_VALIDATION_ENABLED:true}
  retry:
    max-attempts: 3
    initial-delay: 1000
    max-delay: 10000
    multiplier: 2.0

# DeDi Registry for callback URL resolution (resolves subscriber base URL at delivery time)
registry:
  base-url: ${REGISTRY_BASE_URL:}
  name: ${REGISTRY_NAME:keys}

# HTTP Signature Configuration (Ed25519 + BLAKE-512)
# Supports both raw 32-byte seed and PKCS#8 48-byte format
signing:
  enabled: false
  key-id-suffix: ""
  # Option 1: Raw 32-byte seed (beckn-onix compatible)
  private-key: ""
  # Option 2: PKCS#8 format (standard)
  # private-key: -----BEGIN PRIVATE KEY-----MC4CAQAwBQYDK2VwBCIEIPTQYeuz5P+r94q65GGR5UORNasPhorx3QxbSngspcyD-----END PRIVATE KEY-----
  expiry-seconds: 4000
  subscriber-id: ""

# Static callback routing — when enabled, dispatcher posts every outbound
# callback to the configured URL instead of resolving via DeDi.
# Intended for routing through an Onix adapter; leave disabled to preserve
# existing DeDi-based behavior.
static-callback:
  enabled: ${STATIC_CALLBACK_ENABLED:false}
  url: ${STATIC_CALLBACK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: response-dispatcher

logging:
  level:
    org.beckn.seeker: INFO
    org.springframework.kafka: INFO
