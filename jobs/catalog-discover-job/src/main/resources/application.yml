beckn:
  api-prefix: ${BECKN_API_PREFIX:/beckn}

spring:
  application:
    name: discovery-service
  datasource:
    hikari:
      data-source-properties:
        preparedStatementCacheQueries: ${POSTGRES_PS_CACHE_QUERIES:256}
        preparedStatementCacheSizeMiB: ${POSTGRES_PS_CACHE_SIZE_MIB:16}
        # Caches parsed statements per connection to avoid repeated plan/parse cost
  
  jackson:
    serialization:
      write-null-map-values: false
    default-property-inclusion: non_null
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: discovery-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      missing-topics-fatal: false

# Beckn Auth SDK — signature verification for /beckn/discover

# Discovery Service Configuration
discovery:
  # Our service's BPP identity stamped onto outbound on_discover responses.
  # Leave unset/blank to preserve existing behavior (no stamping).
  bpp-id: ${DISCOVERY_BPP_ID:}
  bpp-uri: ${DISCOVERY_BPP_URI:}
  auth:
    enabled: ${SIGNATURE_AUTH_ENABLED:false}
    registry-base-url: ${SIGNATURE_REGISTRY_BASE_URL:}
    registry-name: ${SIGNATURE_REGISTRY_NAME:keys}
    registry-token: ${SIGNATURE_REGISTRY_TOKEN:}
    clock-skew-seconds: ${SIGNATURE_CLOCK_SKEW_SECONDS:30}
    cache-ttl-seconds: ${SIGNATURE_CACHE_TTL_SECONDS:2592000}
    cache-max-keys: ${SIGNATURE_CACHE_MAX_KEYS:100}
    timeout-seconds: ${SIGNATURE_TIMEOUT_SECONDS:10}
    retry-attempts: ${SIGNATURE_RETRY_ATTEMPTS:3}
    # Comma-separated METHOD:PATH pairs that bypass signature verification.
    # Format: POST:/beckn/discover,GET:/beckn/discover
    # Supports {param} and :param wildcards. Leave empty to protect all endpoints.
    whitelisted-endpoints: ${SIGNATURE_WHITELISTED_ENDPOINTS:}
  latency-tracking-enabled: ${DISCOVERY_LATENCY_TRACKING_ENABLED:true}
  filter:
    discard-catalogs-without-offers: ${DISCOVERY_FILTER_DISCARD_CATALOGS_WITHOUT_OFFERS:true}
  kafka:
    request-topic: ${KAFKA_REQUEST_TOPIC:discovr.discover.in.requests}
    response-topic: ${KAFKA_RESPONSE_TOPIC:discovr.discover.out.responses}
    # TTL for the messageId idempotency cache (M10). Duplicate POST requests within
    # this window are ACK'd immediately without re-publishing to Kafka.
    dedup-cache-ttl-seconds: ${DISCOVERY_DEDUP_CACHE_TTL_SECONDS:60}
  
  nlweb:
    base-url: ${NLWEB_BASE_URL:http://localhost:8000}
    ask-endpoint: ${NLWEB_ASK_ENDPOINT:/ask}
    timeout-seconds: ${NLWEB_TIMEOUT_SECONDS:30}
    streaming: ${NLWEB_STREAMING:false}
    score-threshold: ${NLWEB_SCORE_THRESHOLD:80}
    max-retries: ${NLWEB_MAX_RETRIES:3}
    retry-delay-ms: ${NLWEB_RETRY_DELAY_MS:1000}
  
  # Schema Validation Configuration
  schema:
    url: ${BECKN_PROTOCOL_API_SCHEMA_URL:https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/main/api/v2.0.0/beckn.yaml}
    cache-ttl-hours: ${SCHEMA_CACHE_TTL_HOURS:1}
    fetch-timeout-seconds: ${SCHEMA_FETCH_TIMEOUT_SECONDS:30}
    max-retries: ${SCHEMA_FETCH_MAX_RETRIES:3}
    retry-delay-ms: ${SCHEMA_FETCH_RETRY_DELAY_MS:1000}
  
  # ─── Text Search ──────────────────────────────────────────────────────────
  # Controls how free-text queries (message.text_search) are resolved.
  #
  # engine options:
  #   native-els      — keyword BM25 multi_match on full_text_blob + item_name (no AI, default)
  #   els-semantic-search — full natural language vector knn search:
  #                       1. LLM enriches the raw query with synonyms and domain vocabulary
  #                       2. Enriched query is embedded and matched via knn against item_vector
  #                     Both embedding-model and llm-model must be configured.
  #   nlweb           — delegates to an external NLWeb service
  text-search:
    engine: ${DISCOVERY_TEXT_SEARCH_ENGINE:native-els}

    # Converts text to dense vectors for semantic similarity matching.
    # Supports any OpenAI-compatible /v1/embeddings provider.
    # IMPORTANT: model name MUST match catalog-publish-job — same model both sides.
    # Changing the model requires recreating the Elasticsearch index.
    embedding-model:
      name: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_NAME:nomic-embed-text}
      base-url: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_BASE_URL:http://localhost:11434}
      api-key: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_API_KEY:}
      timeout-ms: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_TIMEOUT_MS:10000}
      # knn search candidate pool — higher = more accurate but slower.
      # Tuning guidance: set to 2-4x the expected filtered result set size.
      # When narrow schema-context filters are present the effective corpus shrinks;
      # keeping knn-candidates at 500 when the filtered index has only ~50 docs
      # wastes latency by visiting all documents. Lower this value (e.g. 100-200)
      # in single-schema deployments with small per-schema corpora.
      # The actual value used per search is logged at DEBUG level (numCandidates=...).
      knn-candidates: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_KNN_CANDIDATES:500}
      retries: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_RETRIES:3}
      retry-delay-ms: ${DISCOVERY_TEXT_SEARCH_EMBEDDING_RETRY_DELAY_MS:1000}

    # Enriches the raw search query before embedding to improve semantic match quality.
    # Optional — when disabled, the raw query is embedded directly.
    # Supports any OpenAI-compatible /v1/chat/completions provider.
    llm-model:
      # Set to false to disable LLM enrichment (e.g. CPU-only environments).
      enabled: ${DISCOVERY_TEXT_SEARCH_LLM_ENABLED:true}
      name: ${DISCOVERY_TEXT_SEARCH_LLM_NAME:gpt-4o-mini}
      base-url: ${DISCOVERY_TEXT_SEARCH_LLM_BASE_URL:https://api.openai.com}
      api-key: ${DISCOVERY_TEXT_SEARCH_LLM_API_KEY:}
      timeout-ms: ${DISCOVERY_TEXT_SEARCH_LLM_TIMEOUT_MS:30000}
      retries: ${DISCOVERY_TEXT_SEARCH_LLM_RETRIES:3}
      retry-delay-ms: ${DISCOVERY_TEXT_SEARCH_LLM_RETRY_DELAY_MS:1000}
      # 0 = deterministic output (recommended for query enrichment)
      temperature: ${DISCOVERY_TEXT_SEARCH_LLM_TEMPERATURE:0.0}
      system-prompt: ${DISCOVERY_TEXT_SEARCH_LLM_SYSTEM_PROMPT:You are a search query enricher for a product and service catalog. Append up to 5 highly relevant synonyms or specifications to the original query. Keep the original query words first, then add only closely related terms. Return only the expanded query as a single short line. Do not add loosely related terms, brands, or categories. No explanation. No formatting.}

  # Spatial search engine — "postgresql" (default) or "elasticsearch"
  spatial:
    engine: ${DISCOVERY_SPATIAL_ENGINE:postgresql}

  # Elasticsearch configuration (active when text-search.engine or spatial.engine=elasticsearch)
  elasticsearch:
    hosts: ${ES_HOSTS:http://localhost:9200}
    alias-name: ${ES_ALIAS:beckn-catalog}
    result-limit: ${ES_RESULT_LIMIT:50}
    # ES normalizes cosine as (1 + cosine) / 2, so 0.72 means ~0.44 raw cosine similarity.
    min-score: ${ES_MIN_SCORE:0.72}
    connect-timeout-ms: ${ES_CONNECT_TIMEOUT_MS:5000}
    socket-timeout-ms: ${ES_SOCKET_TIMEOUT_MS:30000}
    multi-match-fields: ${ES_MULTI_MATCH_FIELDS:full_text_blob,resource_name^2,catalog_name^2,resource_provider_name^1.5}
    # Drop hits scoring below this fraction of the top hit's score (0.0-1.0).
    # 0.6 = keep only hits with >= 60% of the top score. 0.0 = disable.
    relative-score-threshold: ${ES_RELATIVE_SCORE_THRESHOLD:0.6}
    # best_fields scoring: weight given to non-best matching fields (0.0-1.0).
    # 0.0 = pure best-field-only; 1.0 = sum across all fields.
    tie-breaker: ${ES_TIE_BREAKER:0.3}
    # Typo tolerance for text matching (AUTO|0|1|2). AUTO scales with term length.
    fuzziness: ${ES_FUZZINESS:AUTO}

  # PostgreSQL Configuration for filter-based queries
  postgresql:
    host: ${POSTGRES_HOST:localhost}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DATABASE:beckn_catalog}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT:30000}
    result-limit: ${MAX_ITEMS_PER_CATALOG:100}
    log-explain-analyze: ${POSTGRES_LOG_EXPLAIN_ANALYZE:false}
    parallel-query-timeout-seconds: ${DISCOVERY_PARALLEL_QUERY_TIMEOUT_SECONDS:10}
    # Catalog-level attributes to extract from catalog.payload
    # These attributes will be merged into catalog objects in the response
    catalog-attributes-to-extract:
      - "offers"

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s
    distribution:
      percentiles-histogram:
        http.server.requests: true
        discovery.requests.duration: true
        discovery.nlweb.duration: true
        discovery.processing.duration: true
        discovery.publishing.duration: true
    tags:
      application: discovery-service
      environment: ${SPRING_PROFILES_ACTIVE:default}
  tracing:
    sampling:
      probability: 1.0
    enabled: false
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

# Logging Configuration
logging:
  level:
    org.beckn.discover: INFO
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{messageId},%X{transactionId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{messageId},%X{transactionId}] %logger{36} - %msg%n"
  file:
    name: logs/discovery-service.log

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/ld+json,application/xml,text/plain,text/xml,text/html
    min-response-size: 2KB
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:50}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
      # Guidance: keep max ≈ 5x CPU cores (50 for 1 vCPU) so threads don't thrash
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    # When worker threads are busy, up to 100 new requests queue before being rejected
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:2000}
    # Cap simultaneous keep-alive connections to avoid exhausting file descriptors