app:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  messaging:
    broker-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: catalog-publish-group
      concurrency: 3
      max-poll-records: 10
      session-timeout-ms: 30000
      max-poll-interval-ms: 300000
    topics:
      ingestion-requests: discovr.publish.in.requests
      catalog-events: discovr.publish.out.events
      responses: discovr.publish.out.responses
      failed: discovr.publish.dlt.requests

  catalog:
    max-payload-size: 5242880
    validation-enabled: true
    schema-url: ${BECKN_PROTOCOL_API_SCHEMA_URL:https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/main/api/v2.0.0/beckn.yaml}
    parallel-catalog-threshold: 3
    # Thread pool size for parallel catalog processing within a single message.
    processing-pool-size: 8

    # ─── Text Search Indexing ──────────────────────────────────────────────
    # Controls whether item text is converted to vectors at index time.
    # Vectors are stored in Elasticsearch and used by the discovery service
    # for semantic search (engine: els-semantic-search).
    text-search:
      embedding-model:
        # Set to true to enable semantic indexing — stores item vectors in Elasticsearch.
        # When enabled, items are indexed with a dense_vector field (item_vector)
        # that the discovery service uses for knn similarity search.
        enabled: ${CATALOG_TEXT_SEARCH_EMBEDDING_ENABLED:false}
        # Supports any OpenAI-compatible /v1/embeddings provider
        # (Ollama local, OpenAI, Azure OpenAI, Groq, etc.)
        # IMPORTANT: must match DISCOVERY_TEXT_SEARCH_EMBEDDING_NAME in discovery service.
        # Changing the model requires recreating the Elasticsearch index.
        name: ${CATALOG_TEXT_SEARCH_EMBEDDING_NAME:nomic-embed-text}
        base-url: ${CATALOG_TEXT_SEARCH_EMBEDDING_BASE_URL:http://localhost:11434}
        api-key: ${CATALOG_TEXT_SEARCH_EMBEDDING_API_KEY:}
        timeout-ms: ${CATALOG_TEXT_SEARCH_EMBEDDING_TIMEOUT_MS:10000}
        retries: ${CATALOG_TEXT_SEARCH_EMBEDDING_RETRIES:3}
        retry-delay-ms: ${CATALOG_TEXT_SEARCH_EMBEDDING_RETRY_DELAY_MS:1000}

    elasticsearch:
      enabled: false
      hosts: ${ES_HOSTS:http://localhost:9200}
      index-prefix: beckn-catalog
      alias-name: beckn-catalog
      failure-topic: discovr.publish.es.failures
      final-dlq-topic: discovr.publish.es.dlt
      bulk-batch-size: 100
      retry-attempts: 3
      retry-initial-delay-ms: 1000
      pool-size: 2
      pool-queue-capacity: 200
      max-failure-attempts: 5
      mapping:
        total-fields-limit: ${ES_MAPPING_TOTAL_FIELDS_LIMIT:2000}
        depth-limit: ${ES_MAPPING_DEPTH_LIMIT:10}
        template-file: ${ES_MAPPING_TEMPLATE_FILE:}

  http:
    signature-verification-enabled: false

spring:
  application:
    name: catalog-publish-job
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.show-details: when-authorized

logging:
  level:
    org.beckn.catalogpublish: INFO
