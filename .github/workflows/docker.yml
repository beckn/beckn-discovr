name: GCP Artifact Registry — Build & Push

on:
  push:
    tags:
      - 'v*'                    # All services: v1.5.0
      - 'discover/v*'           # Only catalog-discover-job: discover/v1.5.0
      - 'publish/v*'            # Only catalog-publish-job: publish/v1.5.0
      - 'dispatcher/v*'         # Only response-dispatcher: dispatcher/v1.5.0

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for OIDC token

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: catalog-discover-job
            dockerfile: jobs/catalog-discover-job/Dockerfile
          - name: catalog-publish-job
            dockerfile: jobs/catalog-publish-job/Dockerfile
          - name: response-dispatcher
            dockerfile: jobs/response-dispatcher/Dockerfile

    # Only run jobs for services matching the tag prefix
    if: |
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '/')) ||
      (startsWith(github.ref, 'refs/tags/discover/') && matrix.name == 'catalog-discover-job') ||
      (startsWith(github.ref, 'refs/tags/publish/') && matrix.name == 'catalog-publish-job') ||
      (startsWith(github.ref, 'refs/tags/dispatcher/') && matrix.name == 'response-dispatcher')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag (remove prefix for selective tags)
        id: resolve
        run: |
          TAG="${{ github.ref_name }}"

          # If tag contains '/', remove prefix (discover/, publish/, dispatcher/)
          if [[ "$TAG" == *"/"* ]]; then
            VERSION="${TAG#*/}"
          else
            VERSION="$TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    ${{ matrix.dockerfile }}
          push: true
          tags: |
            asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${{ matrix.name }}:${{ steps.resolve.outputs.version }}
            asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan (HIGH,CRITICAL) [non-blocking]
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${{ matrix.name }}:${{ steps.resolve.outputs.version }}
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report-${{ matrix.name }}
          path: trivy-image-report.json
          retention-days: 30
