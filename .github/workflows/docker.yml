name: Docker Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: catalog-discover-job
            context: jobs/catalog-discover-job
            dockerfile: jobs/catalog-discover-job/Dockerfile
          - name: catalog-publish-job
            context: jobs/catalog-publish-job
            dockerfile: jobs/catalog-publish-job/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Determine image ref for scanning
        id: image-ref
        run: |
          set -euo pipefail
          first="$(printf "%s\n" "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "ref=${first#ref=}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan (HIGH,CRITICAL) [non-blocking]
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ${{ steps.image-ref.outputs.ref }}
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report-${{ matrix.name }}
          path: trivy-image-report.json
          retention-days: 30
