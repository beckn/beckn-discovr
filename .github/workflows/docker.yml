name: Build & Push to GCP Artifact Registry

# ═════════════════════════════════════════════════════════════════════════════════
# PREREQUISITES: GCP Workload Identity Federation (OIDC) Setup Required
# ═════════════════════════════════════════════════════════════════════════════════
# This workflow requires GCP OIDC setup to be completed BEFORE merging:
#
# Required GitHub Secrets (must be configured in repository settings):
#   1. GCP_WORKLOAD_IDENTITY_PROVIDER
#      - Format: projects/{PROJECT_NUMBER}/locations/global/workloadIdentityPools/{POOL_ID}/providers/{PROVIDER_ID}
#
#   2. GCP_SERVICE_ACCOUNT
#      - Format: {SERVICE_ACCOUNT_NAME}@{PROJECT_ID}.iam.gserviceaccount.com
#
# If these secrets are NOT configured:
#   - Workflow will fail at the "Authenticate to Google Cloud (OIDC)" step
#   - Error: "Unable to generate Google Cloud federated token"
#   - All tag pushes will be blocked until secrets are configured
#
# Setup Instructions: See docs/GITHUB_ACTIONS_GCP_AR_SETUP.md
# ═════════════════════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deps_base_tag:
        description: 'gradle-deps-base image tag to use as DEPS_BASE (e.g. 1.0, v1.1). Defaults to 1.0.'
        required: false
        default: '1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checkov:skip=CKV_GHA_7:deps_base_tag selects the prebuilt deps-base image tag; intentional and required
# Least-privilege default; jobs widen as needed (e.g. id-token: write for OIDC).
permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: catalog-discover-job
            dockerfile: jobs/catalog-discover-job/Dockerfile
            build_args: 'DEPS_BASE=asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/gradle-deps-base'
          - name: catalog-publish-job
            dockerfile: jobs/catalog-publish-job/Dockerfile
            build_args: 'DEPS_BASE=asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/gradle-deps-base'
          - name: response-dispatcher
            dockerfile: jobs/response-dispatcher/Dockerfile
            build_args: 'DEPS_BASE=asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/gradle-deps-base'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve DEPS_BASE build arg
        id: deps_base
        # Route workflow-context data through env vars (never inline ${{ }} in run:) — CWE-94 shell injection.
        env:
          DEPS_BASE_TAG: ${{ inputs.deps_base_tag || '1.0' }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          echo "value=${BUILD_ARGS}:${DEPS_BASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve version tag and tags
        id: resolve
        # Route workflow-context data through env vars (never inline ${{ }} in run:) — CWE-94 shell injection.
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          # Since we only use universal tags (v*), version is the tag name
          VERSION="$REF_NAME"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Build image tags (version + latest)
          {
            echo "tags<<EOF"
            echo "asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${IMAGE_NAME}:${VERSION}"
            echo "asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Docker Hardened Images (DHI) base images are pulled from dhi.io during
      # the build. Read-only (pull) credentials are enough — CI never pushes to
      # dhi.io. Requires the DHI_USERNAME / DHI_TOKEN repo secrets.
      - name: Log in to dhi.io (pull DHI base images)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file:    ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          build-args: ${{ steps.deps_base.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image-layer CVE scan (REPORT-ONLY) ───────────────────────────────
      # Scans the exact image just pushed (by digest). Findings are advisory:
      # published to the run's Job Summary + a downloadable artifact for a human
      # to act on. A CVE here NEVER fails the release build (exit-code 0). The
      # DHI base is ~0-CVE, so this surfaces app-layer (jar) vulnerabilities.
      - name: Install Trivy CLI
        env:
          TRIVY_VERSION: '0.70.0'
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy image scan (report-only)
        # Route workflow-context data through env vars (never inline ${{ }} in run:) — CWE-94 shell injection.
        env:
          IMAGE_REF: asia-south1-docker.pkg.dev/beckn-one-infra-services/beckn-discovr/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_VERSION: ${{ steps.resolve.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set +e
          echo "Scanning $IMAGE_REF"
          trivy image "$IMAGE_REF" \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --exit-code 0 \
            --format table > trivy-image.txt
          {
            echo "## 🛡️ Trivy image scan — ${IMAGE_NAME}:${IMAGE_VERSION}"
            echo ""
            echo "Report-only — a CVE here does not fail the release. Digest: \`${IMAGE_DIGEST}\`"
            echo ""
            echo '```'
            if [ -s trivy-image.txt ]; then cat trivy-image.txt; else echo "(no fixable CRITICAL/HIGH/MEDIUM vulnerabilities)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-${{ matrix.name }}
          path: trivy-image.txt
          if-no-files-found: ignore

