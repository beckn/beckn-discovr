name: Code Quality & Security Tests

on:
  pull_request:
    paths:
      - 'jobs/**'
      - 'sdks/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check Modified Files
    runs-on: ubuntu-latest
    outputs:
      discover: ${{ steps.filter.outputs.discover }}
      publish: ${{ steps.filter.outputs.publish }}
      dispatcher: ${{ steps.filter.outputs.dispatcher }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            discover: 'jobs/catalog-discover-job/**'
            publish: 'jobs/catalog-publish-job/**'
            dispatcher: 'jobs/response-dispatcher/**'
            shared:
              - 'sdks/**'
              - '.github/workflows/ci.yml'

  gradle-tests:
    name: Gradle Tests
    needs: check-changes
    if: ${{ needs.check-changes.outputs[matrix.job_key] == 'true' || needs.check-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: catalog-discover-job
            job_key: discover
            path: jobs/catalog-discover-job
            run_integration_tests: false
          - name: catalog-publish-job
            job_key: publish
            path: jobs/catalog-publish-job
            run_integration_tests: true
          - name: response-dispatcher
            job_key: dispatcher
            path: jobs/response-dispatcher
            run_integration_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ matrix.path }}

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        working-directory: ${{ matrix.path }}

      - name: Run integration tests
        if: ${{ matrix.run_integration_tests }}
        run: ./gradlew integrationTest --no-daemon
        working-directory: ${{ matrix.path }}

