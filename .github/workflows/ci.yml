name: Discovr CI

on:
  pull_request:
    paths:
      - 'jobs/**'
      - 'sdks/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs widen as needed (e.g. pull-requests: read on check-changes).
permissions:
  contents: read

jobs:
  # dorny/paths-filter uses the GitHub API on pull_request events — no checkout needed.
  check-changes:
    name: Check Modified Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads changed files via the PR API
    outputs:
      discover: ${{ steps.filter.outputs.discover }}
      publish: ${{ steps.filter.outputs.publish }}
      dispatcher: ${{ steps.filter.outputs.dispatcher }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Path Filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            discover: 'jobs/catalog-discover-job/**'
            publish: 'jobs/catalog-publish-job/**'
            dispatcher: 'jobs/response-dispatcher/**'
            shared:
              - 'sdks/**'
              - '.github/workflows/ci.yml'

  # ── Java Jobs — each runs only when its own code (or shared) changed ─────────

  test-discover:
    name: catalog-discover-job
    needs: check-changes
    if: ${{ needs.check-changes.outputs.discover == 'true' || needs.check-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: jobs/catalog-discover-job
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: jobs/catalog-discover-job/build.gradle
      - name: Test and Coverage
        run: ./gradlew test jacocoTestReport --no-daemon
        working-directory: jobs/catalog-discover-job
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-discover-job-test-results
          path: jobs/catalog-discover-job/build/test-results/**/*.xml
          retention-days: 1
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-discover-job-coverage
          path: jobs/catalog-discover-job/build/reports/jacoco/**
          retention-days: 1

  test-publish:
    name: catalog-publish-job
    needs: check-changes
    if: ${{ needs.check-changes.outputs.publish == 'true' || needs.check-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: jobs/catalog-publish-job
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: jobs/catalog-publish-job/build.gradle
      - name: Test and Coverage
        run: ./gradlew test integrationTest jacocoTestReport --no-daemon
        working-directory: jobs/catalog-publish-job
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-publish-job-test-results
          path: jobs/catalog-publish-job/build/test-results/**/*.xml
          retention-days: 1
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-publish-job-coverage
          path: jobs/catalog-publish-job/build/reports/jacoco/**
          retention-days: 1

  test-dispatcher:
    name: response-dispatcher
    needs: check-changes
    if: ${{ needs.check-changes.outputs.dispatcher == 'true' || needs.check-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: jobs/response-dispatcher
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: jobs/response-dispatcher/build.gradle
      - name: Test and Coverage
        run: ./gradlew test jacocoTestReport --no-daemon
        working-directory: jobs/response-dispatcher
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: response-dispatcher-test-results
          path: jobs/response-dispatcher/build/test-results/**/*.xml
          retention-days: 1
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: response-dispatcher-coverage
          path: jobs/response-dispatcher/build/reports/jacoco/**
          retention-days: 1
