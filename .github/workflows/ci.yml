name: CI

on:
  pull_request:
    branches: [main]

jobs:
  gradle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: catalog-discover-job
            path: jobs/catalog-discover-job
            run_integration_tests: false
          - name: catalog-publish-job
            path: jobs/catalog-publish-job
            run_integration_tests: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ matrix.path }}

      - name: Run unit tests
        run: ./gradlew test --no-daemon
        working-directory: ${{ matrix.path }}

      - name: Run integration tests
        if: ${{ matrix.run_integration_tests }}
        run: ./gradlew integrationTest --no-daemon
        working-directory: ${{ matrix.path }}

  trivy-fs-scan:
    name: Trivy (FS) vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute weekly Trivy cache key
        id: trivy-cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: ${{ runner.os }}-trivy-db-${{ steps.trivy-cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Set up JDK 17 (SBOM generation)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            jobs/catalog-discover-job/build.gradle
            jobs/catalog-publish-job/build.gradle

      - name: Generate SBOMs (CycloneDX) for Java jobs
        run: |
          set -euo pipefail
          for job in catalog-discover-job catalog-publish-job; do
            echo "Generating SBOM for jobs/${job}"
            (cd "jobs/${job}" && chmod +x gradlew && ./gradlew --no-daemon cyclonedxDirectBom)
          done

      - name: Run Trivy filesystem scan (HIGH,CRITICAL, vuln-only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-fs-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache-dir: .trivy-cache
          skip-dirs: |
            **/build
            **/.gradle
            **/node_modules

      - name: Install Trivy CLI (for SBOM scanning)
        uses: aquasecurity/setup-trivy@v0.2.5

      - name: Scan SBOMs (Java jobs) with Trivy (HIGH,CRITICAL)
        run: |
          set -euo pipefail
          for job in catalog-discover-job catalog-publish-job; do
            bom="jobs/${job}/build/reports/cyclonedx-direct/bom.json"
            out="trivy-sbom-${job}.json"
            if [ ! -f "$bom" ]; then
              echo "SBOM not found: $bom"
              exit 1
            fi
            trivy sbom "$bom" \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json \
              --output "$out" || true
          done

      - name: Upload Trivy FS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          retention-days: 30

      - name: Upload SBOMs (Java jobs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-jobs-sbom
          path: |
            jobs/catalog-discover-job/build/reports/cyclonedx-direct/bom.json
            jobs/catalog-publish-job/build/reports/cyclonedx-direct/bom.json
          retention-days: 30

      - name: Upload Trivy SBOM reports (Java jobs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-reports
          path: trivy-sbom-*.json
          retention-days: 30

      - name: Comment on PR with report link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = '<!-- trivy-report -->';
            const body = [
              marker,
              '## Trivy vulnerability scan report',
              '',
              `- **Workflow run**: ${runUrl}`,
              `- **Artifacts**: ${runUrl}#artifacts`,
              '  - `trivy-fs-report` (filesystem findings)',
              '  - `java-jobs-sbom` (CycloneDX SBOMs for Java jobs)',
              '  - `trivy-sbom-reports` (Trivy scan results for those SBOMs)',
              '',
              '_This scan is non-blocking (does not fail the PR)._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
