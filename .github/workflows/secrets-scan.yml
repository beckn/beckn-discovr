name: Secrets Scan

# ═════════════════════════════════════════════════════════════════════════════
# Gitleaks — secrets-in-git scanning on pull requests.
#
#   • gitleaks — walks the PR's new commit range (base..head) and flags any
#                secret-shaped strings (API keys, tokens, private keys, etc.).
#                Unlike Trivy's filesystem scanner (see security.yml → trivy-fs,
#                which only inspects the checked-out working tree), gitleaks
#                reads git HISTORY, so it also catches a secret that was
#                committed in one commit and deleted in a later one within the
#                same PR.
#
# Free & open source (MIT). Runs the pinned gitleaks BINARY directly — the
# gitleaks GitHub Action wrapper asks org accounts for a license key; the
# binary never does. No account, no key, no outbound network calls.
#
# No `paths:` filter on purpose. A secret can be hardcoded in ANY file, so this
# gate must run on every PR — restricting it by changed path would defeat it.
#
# Rollout mode: REPORT-ONLY (advisory), matching the security.yml stance.
#   The scan never hard-fails the PR (the run always exits 0). Findings are
#   advisory — published to (1) the run's Job Summary and (2) a sticky PR
#   comment (updated in place). Flip `exit ${code}` (see the step) to enforce a
#   hard gate once the allowlist is tuned.
# ═════════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches:
      - main
      - 'release-*'
      - development
      - security/dependency-vulns   # integration branch for this rollout

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# pull-requests: write lets the job upsert its sticky PR comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks — secrets (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 pulls full history so both the PR base and head commits
      # are present locally — gitleaks needs them to walk the base..head range.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned release binary (no curl|sh into a shell). Asset name format is
      # gitleaks_<version>_linux_x64.tar.gz; the archive contains `gitleaks`.
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: '8.18.4'
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps the actual secret value OUT of the log / PR comment (we
      # publish this output publicly). Scans only THIS PR's commit range so the
      # report reflects what the PR introduces, not pre-existing history noise.
      # A repo-root .gitleaks.toml (if present) is auto-loaded for allowlisting.
      - name: Run Gitleaks (report-only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          gitleaks detect \
            --source . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose \
            --no-banner 2>&1 | tee gitleaks-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "✓ No secrets detected in this PR's commit range." | tee -a gitleaks-output.txt
          else
            echo "::warning::Gitleaks reported potential secrets (exit ${code}) — see the Gitleaks report."
          fi
          # Report-only: always succeed. To ENFORCE a hard gate, replace the
          # next line with:  exit "$code"
          exit 0

      - name: Publish Gitleaks report
        if: always()
        uses: ./.github/actions/scan-report
        with:
          title: '🛡️ Gitleaks — secrets (git history)'
          marker: '<!-- sec-scan:gitleaks -->'
          report-file: gitleaks-output.txt
