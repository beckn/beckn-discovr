name: 'Scan report'
description: >
  Publish a security-scan report to the run's job summary and to a single
  sticky PR comment (created once, updated in place on every push). Report-only.

inputs:
  title:
    description: 'Human-readable section title (also used as the comment heading).'
    required: true
  marker:
    description: 'Unique HTML-comment marker that identifies this sticky comment.'
    required: true
  report-file:
    description: 'Path to the plain-text scan output to publish.'
    required: true
  github-token:
    description: 'Token used to upsert the PR comment.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Always visible on the run page, regardless of PR/permissions.
    # The code fence is sized longer than any backtick run in the content so a
    # finding containing ``` cannot break out of the block.
    - name: Append to job summary
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        REPORT_FILE: ${{ inputs.report-file }}
      run: |
        FENCE='```'
        if [ -s "${REPORT_FILE}" ]; then
          longest=$(grep -oE '`+' "${REPORT_FILE}" | awk '{ if (length > m) m = length } END { print m+0 }')
          n=$(( longest + 1 )); [ "$n" -lt 3 ] && n=3
          FENCE=$(printf '`%.0s' $(seq 1 "$n"))
        fi
        {
          echo "## ${TITLE}"
          echo ""
          echo "${FENCE}"
          if [ -s "${REPORT_FILE}" ]; then cat "${REPORT_FILE}"; else echo "(no findings)"; fi
          echo "${FENCE}"
        } >> "$GITHUB_STEP_SUMMARY"

    # Sticky comment right on the PR. continue-on-error so a read-only token
    # (e.g. a fork PR) can never fail the build.
    - name: Upsert sticky PR comment
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = ${{ toJSON(inputs.marker) }};
          const title  = ${{ toJSON(inputs.title) }};
          const file   = ${{ toJSON(inputs.report-file) }};
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          let raw = '';
          try { raw = fs.readFileSync(file, 'utf8').trim(); } catch (e) { /* file may be absent */ }
          if (!raw) raw = '(no findings)';

          // GitHub hard-caps a comment body at 65536 chars; leave headroom.
          const LIMIT = 60000;
          let note = '';
          if (raw.length > LIMIT) {
            raw = raw.slice(0, LIMIT);
            note = `\n\n_Output truncated — see the [full run](${runUrl}) for everything._`;
          }

          // Fence must be longer than any run of backticks in the content, so a
          // finding that contains ``` cannot terminate the block early.
          const longestRun = (raw.match(/`+/g) || []).reduce((m, s) => Math.max(m, s.length), 0);
          const fence = '`'.repeat(Math.max(3, longestRun + 1));

          const body = [
            marker,
            `### ${title}`,
            `Report-only — these findings do **not** block this PR. [View full run](${runUrl})`,
            '',
            '<details><summary>Findings</summary>',
            '',
            fence,
            raw,
            fence,
            '</details>' + note,
          ].join('\n');

          // Paginate: on a busy PR the sticky comment can fall outside page 1,
          // which would otherwise create a duplicate on every push.
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
