# =============================================================================
# Decentralized Catalog Crawler — POC stack
#
# Brings up the DISCOVER stack + the crawler (NO catalog stack). The crawler reads
# DeDi-published catalog files from a public bucket (a GitHub repo for the POC) and
# syncs them into Discover via POST /catalog/push.
#
# Signature auth is DISABLED here (POC). The stack is self-contained — it ships its
# own Kafka + Zookeeper so it does not depend on the catalog stack.
#
# Run:   docker compose -f docker-compose.crawler-poc.yml up -d --build
# Verify ingestion:  curl 'http://localhost:9200/beckn-catalog*/_count'
#
# The crawler's data source is set via CRAWLER_PROVIDERS (a bucket base URL). Point
# it at the GitHub raw base that hosts /.well-known/dedi.json — nothing is hardcoded.
# =============================================================================
services:

  # ── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - beckn-network

  # ── Kafka (single broker) ──────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - beckn-network

  # ── PostgreSQL (Discover DB — also holds the crawler's two state tables) ─────
  postgres-discovery:
    image: postgis/postgis:15-3.3
    container_name: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog123
      POSTGRESQL_POSTGRES_PASSWORD: catalog123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_discovery_data:/var/lib/postgresql/data
    networks:
      - beckn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch (Discover text/spatial index) ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./config/es-synonyms.txt:/usr/share/elasticsearch/config/config/es-synonyms.txt
    networks:
      - beckn-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Discovr Ingestion — receives /catalog/push, persists to PG + ES ─────────
  discovr-ingestion:
    build:
      context: .
      dockerfile: jobs/catalog-publish-job/Dockerfile
    image: beckn/catalog-publish-job:1.0
    container_name: ingestion
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_FLYWAY_TABLE=flyway_schema_history_publish_no_dist
      - APP_DATASOURCE_URL=jdbc:postgresql://postgres-discovery:5432/catalog_db
      - APP_DATASOURCE_USERNAME=catalog_user
      - APP_DATASOURCE_PASSWORD=catalog123
      - DB_PASSWORD=catalog123
      - APP_MESSAGING_BROKER_SERVERS=kafka:29092
      - APP_MESSAGING_TOPICS_INGESTION_REQUESTS=discovr.publish.in.requests
      - APP_MESSAGING_TOPICS_CATALOG_EVENTS=discovr.publish.out.events
      - APP_MESSAGING_TOPICS_RESPONSES=discovr.publish.out.responses
      - APP_MESSAGING_TOPICS_FAILED=discovr.publish.dlt.requests
      - APP_CATALOG_VALIDATION_ENABLED=false
      - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
      - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - JAVA_TOOL_OPTIONS=
      # Signature auth DISABLED for the POC (design: signatures deferred).
      - SIGNATURE_AUTH_ENABLED=false
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Elasticsearch indexing
      - APP_CATALOG_ELASTICSEARCH_ENABLED=true
      - ES_HOSTS=http://elasticsearch:9200
      - APP_CATALOG_ELASTICSEARCH_INDEX_PREFIX=beckn-catalog
      - APP_CATALOG_ELASTICSEARCH_ALIAS_NAME=beckn-catalog
      - APP_CATALOG_ELASTICSEARCH_FAILURE_TOPIC=discovr.publish.es.failures
      - APP_CATALOG_ELASTICSEARCH_FINAL_DLQ_TOPIC=discovr.publish.es.dlt
      - APP_CATALOG_ELASTICSEARCH_BULK_BATCH_SIZE=100
      - APP_CATALOG_ELASTICSEARCH_RETRY_ATTEMPTS=3
      - APP_CATALOG_ELASTICSEARCH_RETRY_INITIAL_DELAY_MS=1000
      - APP_CATALOG_ELASTICSEARCH_POOL_SIZE=2
      - APP_CATALOG_ELASTICSEARCH_POOL_QUEUE_CAPACITY=200
      - APP_CATALOG_ELASTICSEARCH_MAX_FAILURE_ATTEMPTS=5
      - APP_CATALOG_ELASTICSEARCH_MAPPING_TOTAL_FIELDS_LIMIT=2000
      - APP_CATALOG_ELASTICSEARCH_MAPPING_DEPTH_LIMIT=10
      - ES_MAPPING_TEMPLATE_FILE=/config/es-index-template.json
      - CATALOG_TEXT_SEARCH_EMBEDDING_ENABLED=false
      - CATALOG_INDEXING_MAX_TEXT_BLOB_BYTES=8192
      # Index resources that have no @type under <index-prefix>-attributes instead of skipping them.
      - APP_CATALOG_ELASTICSEARCH_DEFAULT_SCHEMA_TYPE=${APP_CATALOG_ELASTICSEARCH_DEFAULT_SCHEMA_TYPE:-Attributes}
    volumes:
      - ./config/es-index-template.json:/config/es-index-template.json
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres-discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - beckn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # ── Discovr Search — handles discover requests (for verifying ingested data) ─
  catalog-discover-job:
    build:
      context: .
      dockerfile: jobs/catalog-discover-job/Dockerfile
    image: beckn/catalog-discover:1.0
    container_name: discover
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_REQUEST_TOPIC=discovr.discover.in.requests
      - KAFKA_RESPONSE_TOPIC=discovr.discover.out.responses
      - POSTGRES_HOST=postgres-discovery
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=catalog_db
      - POSTGRES_USERNAME=catalog_user
      - POSTGRES_PASSWORD=catalog123
      - POSTGRES_MAX_POOL_SIZE=10
      - MAX_ITEMS_PER_CATALOG=100
      - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
      - SCHEMA_CACHE_TTL_HOURS=24
      - LOGGING_LEVEL_ORG_BECKN_DISCOVER=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=ERROR
      - LOGGING_LEVEL_ORG_APACHE_KAFKA=ERROR
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - DISCOVERY_BPP_ID=
      - DISCOVERY_BPP_URI=
      # Signature auth DISABLED for the POC.
      - SIGNATURE_AUTH_ENABLED=false
      - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - DISCOVERY_SPATIAL_ENGINE=elasticsearch
      - ES_HOSTS=http://elasticsearch:9200
      - ES_ALIAS=beckn-catalog
      - ES_RESULT_LIMIT=50
      - ES_MIN_SCORE=0.68
      - ES_TIE_BREAKER=0.3
      - ES_FUZZINESS=AUTO
      - ES_CONNECT_TIMEOUT_MS=5000
      - ES_SOCKET_TIMEOUT_MS=30000
      - DISCOVERY_PARALLEL_QUERY_TIMEOUT_SECONDS=10
      - DISCOVERY_CHAIN_OVERFETCH_FACTOR=10
      - DISCOVERY_CHAIN_MAX_IDS=5000
      - DISCOVERY_CHAIN_TIMEOUT_SECONDS=20
      - DISCOVERY_FILTER_DISCARD_CATALOGS_WITHOUT_OFFERS=true
      - DISCOVERY_TEXT_SEARCH_ENGINE=native-els
    depends_on:
      postgres-discovery:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - beckn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Discovr Dispatcher — delivers on_discover callbacks to Buyers (BAPs) ─────
  # Signing DISABLED for the POC (callbacks go out unsigned; SSRF check off for local).
  response-dispatcher:
    build:
      context: .
      dockerfile: jobs/response-dispatcher/Dockerfile
    image: beckn/response-dispatcher:1.0
    container_name: dispatcher
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TOPICS_INPUT=discovr.discover.out.responses
      - TOPICS_DLT=discovr.dispatcher.dlt.responses
      - SPRING_KAFKA_CONSUMER_GROUP_ID=seeker-notifier-group
      - SPRING_KAFKA_LISTENER_CONCURRENCY=1
      - REGISTRY_BASE_URL=https://fabric.nfh.global/registry/dedi/lookup
      - REGISTRY_NAME=subscribers.beckn.one
      # Outgoing Beckn HTTP Signature DISABLED for the POC.
      - SIGNING_ENABLED=false
      - STATIC_CALLBACK_ENABLED=false
      - STATIC_CALLBACK_URL=http://onix-discover:8083/caller
      # SSRF validation off for local/Docker development (no public DNS).
      - CALLBACK_URL_VALIDATION_ENABLED=false
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      catalog-discover-job:
        condition: service_healthy
    networks:
      - beckn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── The Crawler ─────────────────────────────────────────────────────────────
  # Reads DeDi-published catalogs from CRAWLER_PROVIDERS and pushes changes to
  # Discover. All settings are config-driven (see crawler/src/main/resources/application.yml).
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    image: beckn/decentralized-catalog-crawler:0.1
    container_name: crawler
    environment:
      # State store — reuses the Discover Postgres (its own two tables via Flyway).
      - CRAWLER_DB_URL=jdbc:postgresql://postgres-discovery:5432/catalog_db
      - CRAWLER_DB_USERNAME=catalog_user
      - CRAWLER_DB_PASSWORD=catalog123
      # Where the manifest-URL list comes from: "config" (CRAWLER_PROVIDERS) or "db" (crawler_source table).
      - CRAWLER_SOURCE=${CRAWLER_SOURCE:-db}
      # Full DeDi manifest URL(s), comma-separated. Defaults to the POC tech-mart bucket manifest.
      # (Used when CRAWLER_SOURCE=config; may be empty when CRAWLER_SOURCE=db.)
      - CRAWLER_PROVIDERS=${CRAWLER_PROVIDERS:-https://raw.githubusercontent.com/ameersohel45/tech-mart/main/.well-known/dedi.json}
      # Push into Discover Ingestion (internal port 8080). The service applies the
      # beckn.api-prefix (/beckn), so the full path is /beckn/catalog/push.
      - CRAWLER_PUSH_ENDPOINT=http://discovr-ingestion:8080/beckn/catalog/push
      # Two cadences: manifest (provider identity + index location) rarely changes → daily;
      # index (catalog changes, in the bucket) → per minute. Both config-driven.
      - CRAWLER_MANIFEST_REFRESH_INTERVAL=${CRAWLER_MANIFEST_REFRESH_INTERVAL:-1d}
      - CRAWLER_INDEX_POLL_INTERVAL=${CRAWLER_INDEX_POLL_INTERVAL:-1m}
      - CRAWLER_HTTP_TIMEOUT=${CRAWLER_HTTP_TIMEOUT:-30s}
      - CRAWLER_MAX_PART_BYTES=${CRAWLER_MAX_PART_BYTES:-10485760}
      # Bypass GitHub raw's CDN cache (max-age 300s) so changes are picked up immediately.
      - CRAWLER_HTTP_CACHE_BUST=${CRAWLER_HTTP_CACHE_BUST:-true}
      # Force IPv4 (some container networks have broken IPv6 egress → the JDK HttpClient hangs
      # trying AAAA and times out) and evict idle keep-alive sockets before the next poll so a
      # CDN/NAT-dropped connection is never reused (avoids "request timed out" on idle polls).
      - JAVA_OPTS=-Xmx384m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true -Djdk.httpclient.keepalive.timeout=30
      - CRAWLER_FEEDBACK_LOG_PATH=/app/logs/feedback.log
    depends_on:
      postgres-discovery:
        condition: service_healthy
      discovr-ingestion:
        condition: service_healthy
    networks:
      - beckn-network
    restart: unless-stopped

volumes:
  postgres_discovery_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  beckn-network:
    driver: bridge
