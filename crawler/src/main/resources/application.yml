spring:
  application:
    name: crawler
  # Crawler state lives in Discovr's Postgres (design doc §5.3). Flyway creates the two tables.
  datasource:
    url: ${CRAWLER_DB_URL}
    username: ${CRAWLER_DB_USERNAME}
    password: ${CRAWLER_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The crawler owns only its two tables; baseline so it coexists with the discover schema.
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_crawler

# All crawler settings — nothing hardcoded; every value is overridable via env.
crawler:
  # Full DeDi manifest URLs (comma-separated). Used when source=config; may be empty for source=db.
  providers: ${CRAWLER_PROVIDERS:}
  # Where the manifest-URL list comes from: "config" (the providers list) or "db" (crawler_source table).
  source: ${CRAWLER_SOURCE:config}
  push-endpoint: ${CRAWLER_PUSH_ENDPOINT}
  # Manifest rarely changes (provider identity + index location) → long cadence, e.g. daily.
  manifest-refresh-interval: ${CRAWLER_MANIFEST_REFRESH_INTERVAL:1d}
  # Index (catalog changes) lives in the bucket → short cadence, e.g. per minute.
  index-poll-interval: ${CRAWLER_INDEX_POLL_INTERVAL:1m}
  http:
    timeout: ${CRAWLER_HTTP_TIMEOUT:30s}
    max-part-bytes: ${CRAWLER_MAX_PART_BYTES:10485760}
    # Append a unique ?cb= to every GET so CDN-cached buckets (GitHub raw) return fresh bytes.
    cache-bust: ${CRAWLER_HTTP_CACHE_BUST:true}
  feedback-log-path: ${CRAWLER_FEEDBACK_LOG_PATH:./feedback.log}

logging:
  level:
    org.beckn.crawler: INFO
