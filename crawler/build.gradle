plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.beckn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Core (no web server — the crawler is a scheduled worker; HTTP done via the JDK client).
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // Structured JSON logging — same encoder/version as the discover + publish jobs.
    implementation 'ch.qos.logback:logback-classic'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.3'
}

// Unit tests only (fast, no Docker). Integration tests are tagged and excluded here.
test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging { events "passed", "skipped", "failed"; exceptionFormat "full" }
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Duser.timezone=UTC']
}

// Integration tests (Testcontainers Postgres + in-process mock host). Run with: ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging { events "passed", "skipped", "failed"; exceptionFormat "full" }
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Duser.timezone=UTC']
    // Pin the docker-java API version so Testcontainers works against daemons that reject the
    // library's legacy 1.32 default (locally seen: "client version 1.32 is too old"). Overridable.
    def dockerApi = System.getenv('DOCKER_API_VERSION') ?: '1.44'
    systemProperty 'api.version', dockerApi
    environment 'DOCKER_API_VERSION', dockerApi
    if (System.getenv('DOCKER_HOST')) {
        environment 'DOCKER_HOST', System.getenv('DOCKER_HOST')
    }
    shouldRunAfter test
}
