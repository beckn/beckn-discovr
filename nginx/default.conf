# Discovr public ingress — Nginx reverse proxy in front of onix-discover.
#
# Mirrors the production NPM rule (see beckn-fabric-automation/docker-deployment/
# discovr/DEPLOYMENT.md). Rewrites the public-friendly /beckn/* URL prefix to
# onix-discover's internal /receiver/* or /caller/* module path, depending on
# whether the action is inbound (received by Discovr) or outbound (sent from
# Discovr to elsewhere on the network).
#
# Inbound actions  (network → Discovr):  discover, catalog/push, catalog/on_publish
#   → /receiver/*  (validateSign + schema + route to internal service)
#
# Outbound actions (Discovr → network):  on_discover, catalog/subscription, catalog/pull
#   → /caller/*    (sign with onix-discover keys + route to recipient)

server {
    listen 80 default_server;
    server_name _;

    # Health endpoint
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # All /beckn/* traffic — split by action between caller (outbound) and receiver (inbound).
    location /beckn/ {
        # Outbound actions → /caller/*
        if ($request_uri ~ "^/beckn/(on_discover|catalog/subscription|catalog/pull)") {
            rewrite ^/beckn/(.*)$ /caller/$1 break;
        }
        # Everything else → /receiver/* (discover, catalog/push, catalog/on_publish, ...)
        if ($request_uri !~ "^/beckn/(on_discover|catalog/subscription|catalog/pull)") {
            rewrite ^/beckn/(.*)$ /receiver/$1 break;
        }
        proxy_pass http://onix-discover:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
