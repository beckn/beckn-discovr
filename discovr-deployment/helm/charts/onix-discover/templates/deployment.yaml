apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beckn-service.fullname" . }}
  labels:
    {{- include "beckn-service.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary .Values.replicaCount 1 (kindIs "float64" .Values.replicaCount) }}
  selector:
    matchLabels:
      {{- include "beckn-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/keyset: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "beckn-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "beckn-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      initContainers:
        # The adapter config has no native env-var interpolation, so keyManager
        # secrets are substituted into the config file at startup from the
        # <release>-keyset Secret, rather than templated in plaintext.
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              cp /config-template/*.yaml /app/config/
              for k in subscriberId keyId signingPrivateKey signingPublicKey encrPrivateKey encrPublicKey; do
                eval "v=\${$k:-}"
                sed -i "s|\${$k}|$v|g" /app/config/discover-adapter.yaml
              done
          envFrom:
            - secretRef:
                name: {{ include "beckn-service.fullname" . }}-keyset
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: rendered-config
              mountPath: /app/config
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "beckn-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.image.pullPolicy | default "IfNotPresent" }}
          command:
            - "./server"
            - "--config=/app/config/discover-adapter.yaml"
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            # Read by cmd/adapter/main.go to build parent_id for log correlation.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}
          {{- end }}
          volumeMounts:
            - name: rendered-config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: {{ include "beckn-service.fullname" . }}-config
        - name: rendered-config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
