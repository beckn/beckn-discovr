# Example values for catalog-discover-job.
# Copy to my-values.yaml, fill in real hosts/secrets, then:
#   helm install catalog-discover-job ./discovr-deployment/helm-charts/catalog-discover-job -f my-values.yaml
#
# NOTE: the env var names below are exactly what the Spring Boot app reads via
# ${VAR_NAME} placeholders in application.yml / application-docker.yml.

replicaCount: 2

image:
  repository: beckn/catalog-discover
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  # Active Spring profile — loads application-docker.yml overrides
  - name: SPRING_PROFILES_ACTIVE
    value: "docker"

  # ── Kafka ──────────────────────────────────────────────────────────────
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka.kafka.svc.cluster.local:9092"
  - name: KAFKA_REQUEST_TOPIC
    value: "discovr.discover.in.requests"
  - name: KAFKA_RESPONSE_TOPIC
    value: "discovr.discover.out.responses"

  # ── PostgreSQL/PostGIS — catalog index database ──────────────────────────
  - name: POSTGRES_HOST
    value: "postgres-discovery.data.svc.cluster.local"
  - name: POSTGRES_PORT
    value: "5432"
  - name: POSTGRES_DATABASE
    value: "catalog_db"
  - name: POSTGRES_USERNAME
    value: "catalog_user"
  # POSTGRES_PASSWORD is supplied via `credentials` below (mounted as env by envFrom)
  - name: POSTGRES_MAX_POOL_SIZE
    value: "10"
  # Max resources returned per catalog in a discover response
  - name: MAX_ITEMS_PER_CATALOG
    value: "100"

  # ── Beckn protocol schema validation ──────────────────────────────────────
  - name: BECKN_PROTOCOL_API_SCHEMA_URL
    value: "https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/main/api/v2.0.0/beckn.yaml"
  - name: SCHEMA_CACHE_TTL_HOURS
    value: "24"
  - name: SCHEMA_VALIDATION_ENABLED
    value: "false"

  # ── Elasticsearch — spatial + text search engine ─────────────────────────
  - name: DISCOVERY_SPATIAL_ENGINE
    value: "elasticsearch"
  - name: ES_HOSTS
    value: "http://elasticsearch.data.svc.cluster.local:9200"
  - name: ES_ALIAS
    value: "beckn-catalog"
  - name: ES_RESULT_LIMIT
    value: "50"
  - name: ES_MIN_SCORE
    value: "0.68"
  - name: DISCOVERY_TEXT_SEARCH_ENGINE
    value: "native-els"
  - name: DISCOVERY_FILTER_DISCARD_CATALOGS_WITHOUT_OFFERS
    value: "true"

  # ── ES-text -> PSQL-JSONPath chain (J+T / J+G+T combos) ──────────────────
  - name: DISCOVERY_CHAIN_TIMEOUT_SECONDS
    value: "20"

  # ── Onix identity stamping on outbound on_discover (only when fronted by
  # an ONIX/Beckn-ONE adapter — otherwise leave unset, see `onix` block) ────
  - name: DISCOVERY_BPP_ID
    value: ""
  - name: DISCOVERY_BPP_URI
    value: ""

  # ── Beckn Auth SDK — HTTP signature verification on /beckn/discover ──────
  - name: SIGNATURE_AUTH_ENABLED
    value: "true"
  - name: SIGNATURE_REGISTRY_BASE_URL
    value: "https://your-registry.example.org/registry/dedi/lookup"
  - name: SIGNATURE_REGISTRY_NAME
    value: "subscribers.beckn.one"
  # SIGNATURE_REGISTRY_TOKEN supplied via `credentials` below
  - name: SIGNATURE_CLOCK_SKEW_SECONDS
    value: "30"
  - name: SIGNATURE_WHITELISTED_ENDPOINTS
    value: ""

  - name: LOGGING_LEVEL_ORG_BECKN_DISCOVER
    value: "INFO"

# Enable only if this deployment sits behind an ONIX/Beckn-ONE adapter that
# needs the BPP identity vars stamped onto responses.
onix:
  enabled: false
  env: []

# Secrets — merged into <release>-credentials Secret (stringData) and mounted
# into the container as plain env vars via envFrom. Replace CHANGE_ME with
# real values; never commit real secrets to this file.
credentials:
  POSTGRES_PASSWORD: "CHANGE_ME"
  SIGNATURE_REGISTRY_TOKEN: "CHANGE_ME"

probes:
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 24

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
