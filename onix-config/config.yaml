appName: "onix-crawler-local"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8081
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: ./plugins

# Crawl-only module. schemaValidator is intentionally omitted (optional in the
# crawl handler) — the ingestion service validates /push downstream, so we skip
# the beckn.yaml fetch inside the crawler. ALL crawler config lives HERE in the
# onix config file (the plugin reads this config map); the compose no longer
# supplies any CRAWLER_* env — only CONFIG_FILE, which names this file.
modules:
  - name: crawl
    path: /crawl
    handler:
      type: crawl
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        crawler:
          id: crawler
          config:
            # Connection / deploy (in-network service names; local test creds).
            CRAWLER_DB_DSN: "postgres://catalog_user:catalog123@postgres-discovery:5432/catalog_db?sslmode=disable"
            CRAWLER_PUSH_ENDPOINT: "http://discovr-ingestion:8080/beckn/catalog/push"
            # Non-resolving placeholder so the scheduled pass is a no-op; drive real
            # crawls via POST /crawl {"indexUrl":"..."} (e.g. an ngrok toolkit URL).
            CRAWLER_INDEX_URLS: "http://catalog-source.invalid/none"
            # Tunables.
            CRAWLER_NETWORK_IDS: ""
            CRAWLER_INDEX_INTERVAL: "1m"
            CRAWLER_CATALOG_INTERVAL: "15s"
            CRAWLER_FETCH_TIMEOUT: "30s"
            CRAWLER_MAX_ARTIFACT_BYTES: "10485760"
            CRAWLER_MAX_DECOMPRESSED_BYTES: "104857600"
            CRAWLER_MAX_PUSH_BYTES: "10485760"
            CRAWLER_MAX_ATTEMPTS: "5"
            CRAWLER_MERGE_ONLY: "true"
