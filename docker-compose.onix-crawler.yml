# =============================================================================
# ONIX Catalog Crawler + Discover stack — one self-contained compose.
#
# Brings up the full Discover stack (kafka, postgres, ES, ingestion, discover,
# dispatcher) AND the onix-crawler (built from ../beckn-onix). Assumes beckn-onix
# and beckn-discovr are cloned as siblings.
#
#   docker compose -f docker-compose.onix-crawler.yml up -d --build
#
# The provider-node TOOLKIT stays SEPARATE (scripts/crawler-poc/provider-node):
#   1) cd scripts/crawler-poc/provider-node && ./serve.sh start   # ngrok public URL
#   2) NGROK_URL=<printed> node publish-ngrok.js                  # point index at the tunnel
#   3) trigger a crawl:
#      curl -s -X POST http://localhost:8091/crawl -H 'Content-Type: application/json' \
#           -d '{"indexUrl":"<NGROK_URL>/catalog/catalog-index.json"}'
#
# Why separate + ngrok: the crawler's SSRF guard refuses private/in-network hosts,
# so the toolkit must be served on a PUBLIC URL (ngrok). CRAWLER_INDEX_URLS defaults
# to a non-resolving host so the scheduled pass is a no-op and you drive it via /crawl.
# =============================================================================
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
    - beckn-network
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
    - beckn-network
  postgres-discovery:
    image: postgis/postgis:15-3.3
    container_name: postgres
    ports:
    - 5434:5432
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog123
      POSTGRESQL_POSTGRES_PASSWORD: catalog123
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
    - postgres_discovery_data:/var/lib/postgresql/data
    networks:
    - beckn-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U catalog_user -d catalog_db
      interval: 10s
      timeout: 5s
      retries: 5
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: elasticsearch
    ports:
    - 9200:9200
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    - ./config/es-synonyms.txt:/usr/share/elasticsearch/config/config/es-synonyms.txt
    networks:
    - beckn-network
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/9200' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  discovr-ingestion:
    build:
      context: .
      dockerfile: jobs/catalog-publish-job/Dockerfile
    image: beckn/catalog-publish-job:1.0
    container_name: ingestion
    ports:
    - 8085:8080
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
    - SPRING_FLYWAY_BASELINE_VERSION=0
    - SPRING_FLYWAY_TABLE=flyway_schema_history_publish_no_dist
    - APP_DATASOURCE_URL=jdbc:postgresql://postgres-discovery:5432/catalog_db
    - APP_DATASOURCE_USERNAME=catalog_user
    - APP_DATASOURCE_PASSWORD=catalog123
    - DB_PASSWORD=catalog123
    - APP_MESSAGING_BROKER_SERVERS=kafka:29092
    - APP_MESSAGING_TOPICS_INGESTION_REQUESTS=discovr.publish.in.requests
    - APP_MESSAGING_TOPICS_CATALOG_EVENTS=discovr.publish.out.events
    - APP_MESSAGING_TOPICS_RESPONSES=discovr.publish.out.responses
    - APP_MESSAGING_TOPICS_FAILED=discovr.publish.dlt.requests
    - APP_CATALOG_VALIDATION_ENABLED=false
    - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
    - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
    - JAVA_TOOL_OPTIONS=
    - SIGNATURE_AUTH_ENABLED=false
    - OTEL_TRACES_EXPORTER=none
    - OTEL_METRICS_EXPORTER=none
    - OTEL_LOGS_EXPORTER=none
    - APP_CATALOG_ELASTICSEARCH_ENABLED=true
    - ES_HOSTS=http://elasticsearch:9200
    - APP_CATALOG_ELASTICSEARCH_INDEX_PREFIX=beckn-catalog
    - APP_CATALOG_ELASTICSEARCH_ALIAS_NAME=beckn-catalog
    - APP_CATALOG_ELASTICSEARCH_FAILURE_TOPIC=discovr.publish.es.failures
    - APP_CATALOG_ELASTICSEARCH_FINAL_DLQ_TOPIC=discovr.publish.es.dlt
    - APP_CATALOG_ELASTICSEARCH_BULK_BATCH_SIZE=100
    - APP_CATALOG_ELASTICSEARCH_RETRY_ATTEMPTS=3
    - APP_CATALOG_ELASTICSEARCH_RETRY_INITIAL_DELAY_MS=1000
    - APP_CATALOG_ELASTICSEARCH_POOL_SIZE=2
    - APP_CATALOG_ELASTICSEARCH_POOL_QUEUE_CAPACITY=200
    - APP_CATALOG_ELASTICSEARCH_MAX_FAILURE_ATTEMPTS=5
    - APP_CATALOG_ELASTICSEARCH_MAPPING_TOTAL_FIELDS_LIMIT=2000
    - APP_CATALOG_ELASTICSEARCH_MAPPING_DEPTH_LIMIT=10
    - ES_MAPPING_TEMPLATE_FILE=/config/es-index-template.json
    - CATALOG_TEXT_SEARCH_EMBEDDING_ENABLED=false
    - CATALOG_INDEXING_MAX_TEXT_BLOB_BYTES=8192
    - APP_CATALOG_ELASTICSEARCH_DEFAULT_SCHEMA_TYPE=${APP_CATALOG_ELASTICSEARCH_DEFAULT_SCHEMA_TYPE:-Attributes}
    volumes:
    - ./config/es-index-template.json:/config/es-index-template.json
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres-discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
    - beckn-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/8080'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
  catalog-discover-job:
    build:
      context: .
      dockerfile: jobs/catalog-discover-job/Dockerfile
    image: beckn/catalog-discover:1.0
    container_name: discover
    ports:
    - 8082:8080
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    - KAFKA_REQUEST_TOPIC=discovr.discover.in.requests
    - KAFKA_RESPONSE_TOPIC=discovr.discover.out.responses
    - POSTGRES_HOST=postgres-discovery
    - POSTGRES_PORT=5432
    - POSTGRES_DATABASE=catalog_db
    - POSTGRES_USERNAME=catalog_user
    - POSTGRES_PASSWORD=catalog123
    - POSTGRES_MAX_POOL_SIZE=10
    - MAX_ITEMS_PER_CATALOG=100
    - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/tags/core-v2.0.0-lts/api/v2.0.0/beckn.yaml
    - SCHEMA_CACHE_TTL_HOURS=24
    - LOGGING_LEVEL_ORG_BECKN_DISCOVER=INFO
    - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=ERROR
    - LOGGING_LEVEL_ORG_APACHE_KAFKA=ERROR
    - OTEL_TRACES_EXPORTER=none
    - OTEL_METRICS_EXPORTER=none
    - OTEL_LOGS_EXPORTER=none
    - DISCOVERY_BPP_ID=
    - DISCOVERY_BPP_URI=
    - SIGNATURE_AUTH_ENABLED=false
    - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    - DISCOVERY_SPATIAL_ENGINE=elasticsearch
    - ES_HOSTS=http://elasticsearch:9200
    - ES_ALIAS=beckn-catalog
    - ES_RESULT_LIMIT=50
    - ES_MIN_SCORE=0.68
    - ES_TIE_BREAKER=0.3
    - ES_FUZZINESS=AUTO
    - ES_CONNECT_TIMEOUT_MS=5000
    - ES_SOCKET_TIMEOUT_MS=30000
    - DISCOVERY_PARALLEL_QUERY_TIMEOUT_SECONDS=10
    - DISCOVERY_CHAIN_OVERFETCH_FACTOR=10
    - DISCOVERY_CHAIN_MAX_IDS=5000
    - DISCOVERY_CHAIN_TIMEOUT_SECONDS=20
    - DISCOVERY_FILTER_DISCARD_CATALOGS_WITHOUT_OFFERS=true
    - DISCOVERY_TEXT_SEARCH_ENGINE=native-els
    depends_on:
      postgres-discovery:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
    - beckn-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/8080'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  response-dispatcher:
    build:
      context: .
      dockerfile: jobs/response-dispatcher/Dockerfile
    image: beckn/response-dispatcher:1.0
    container_name: dispatcher
    ports:
    - 8086:8080
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    - TOPICS_INPUT=discovr.discover.out.responses
    - TOPICS_DLT=discovr.dispatcher.dlt.responses
    - SPRING_KAFKA_CONSUMER_GROUP_ID=seeker-notifier-group
    - SPRING_KAFKA_LISTENER_CONCURRENCY=1
    - REGISTRY_BASE_URL=https://fabric.nfh.global/registry/dedi/lookup
    - REGISTRY_NAME=subscribers.beckn.one
    - SIGNING_ENABLED=false
    - STATIC_CALLBACK_ENABLED=false
    - STATIC_CALLBACK_URL=http://onix-discover:8083/caller
    - CALLBACK_URL_VALIDATION_ENABLED=false
    - OTEL_TRACES_EXPORTER=none
    - OTEL_METRICS_EXPORTER=none
    - OTEL_LOGS_EXPORTER=none
    depends_on:
      catalog-discover-job:
        condition: service_healthy
    networks:
    - beckn-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/8080'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  onix-crawler:
    build:
      context: ../beckn-onix
      dockerfile: Dockerfile.adapter-with-plugins
    image: beckn/onix-adapter-crawler:test
    container_name: onix-crawler
    ports:
    - 8091:8081
    environment:
    - CONFIG_FILE=/app/onix-config/config.yaml
    - CRAWLER_DB_DSN=postgres://catalog_user:catalog123@postgres-discovery:5432/catalog_db?sslmode=disable
    - CRAWLER_PUSH_ENDPOINT=http://discovr-ingestion:8080/beckn/catalog/push
    - CRAWLER_INDEX_URLS=${CRAWLER_INDEX_URLS:-http://catalog-source.invalid/none}
    volumes:
    - ./onix-config:/app/onix-config:ro
    depends_on:
      postgres-discovery:
        condition: service_healthy
      discovr-ingestion:
        condition: service_healthy
    networks:
    - beckn-network
    restart: unless-stopped
volumes:
  postgres_discovery_data:
    driver: local
  elasticsearch_data:
    driver: local
networks:
  beckn-network:
    driver: bridge
