services:
  # PostgreSQL Database for Discovered Catalogs
  postgres-discovery:
    image: postgis/postgis:15-3.3
    container_name: discovery-service-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog123
      POSTGRESQL_POSTGRES_PASSWORD: catalog123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_discovery_data:/var/lib/postgresql/data
    networks:
      - beckn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for text search (optional backend for catalog-discover-job)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: discovery-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      # synonyms_path in ES template is relative to ES config dir (/usr/share/elasticsearch/config/)
      - ./config/es-synonyms.txt:/usr/share/elasticsearch/config/config/es-synonyms.txt
    networks:
      - beckn-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ollama — local LLM server for generating vector embeddings
  # No host port binding — only accessible within beckn-network
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - beckn-network
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 20s

  # Pulls required models once after Ollama is healthy — skips if already cached
  # OLLAMA_NOPRINTER=1 disables the TUI progress display so it works without a TTY
  # ollama-init:
  #   image: ollama/ollama:latest
  #   container_name: ollama-init
  #   entrypoint: ["/bin/bash", "-c"]
  #   command: "ollama pull nomic-embed-text 2>&1 | cat && ollama pull llama3.2:1b 2>&1 | cat"
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #     - OLLAMA_NOPRINTER=1
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   networks:
  #     - beckn-network
  #   restart: "no"

  # on-discovery-api removed — catalog push is now handled by catalog-publish service (POST /catalog/push)

  # ── Discovr Ingestion ──────────────────────────────────────────────────────
  # Receives catalog/push from Catalg Delivery and persists to Discovr's DB + ES.
  discovr-ingestion:
    build:
      context: .
      dockerfile: jobs/catalog-publish-job/Dockerfile
    image: beckn/catalog-publish-job:1.0
    container_name: discovr-ingestion
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=0
      - SPRING_FLYWAY_TABLE=flyway_schema_history_publish_no_dist
      - APP_DATASOURCE_URL=jdbc:postgresql://postgres-discovery:5432/catalog_db
      - APP_DATASOURCE_USERNAME=catalog_user
      - APP_DATASOURCE_PASSWORD=catalog123
      - DB_PASSWORD=catalog123
      - APP_MESSAGING_BROKER_SERVERS=kafka:29092
      - APP_MESSAGING_TOPICS_INGESTION_REQUESTS=discovr.publish.in.requests
      - APP_MESSAGING_TOPICS_CATALOG_EVENTS=discovr.publish.out.events
      - APP_MESSAGING_TOPICS_RESPONSES=discovr.publish.out.responses
      - APP_MESSAGING_TOPICS_FAILED=discovr.publish.dlt.requests
      - APP_CATALOG_VALIDATION_ENABLED=false
      - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/catalog-schema-changes/api/v2.0.0/beckn.yaml
      - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - JAVA_TOOL_OPTIONS=
      # Beckn Auth SDK — signature verification for /catalog/push
      - SIGNATURE_AUTH_ENABLED=true
      - SIGNATURE_REGISTRY_BASE_URL=https://fabric.nfh.global/registry/dedi/lookup
      - SIGNATURE_REGISTRY_NAME=subscribers.beckn.one
      - SIGNATURE_REGISTRY_TOKEN=
      - SIGNATURE_CLOCK_SKEW_SECONDS=30
      - SIGNATURE_CACHE_TTL_SECONDS=2592000
      - SIGNATURE_CACHE_MAX_KEYS=100
      - SIGNATURE_TIMEOUT_SECONDS=10
      - SIGNATURE_RETRY_ATTEMPTS=3
      # Whitelisted endpoints — comma-separated METHOD:PATH pairs that bypass signature verification
      # Paths are absolute URI paths (e.g. POST:/catalog/push)
      # Supports {param} and :param wildcards (e.g. GET:/catalog/{id})
      # Leave empty to require auth on all endpoints when SIGNATURE_AUTH_ENABLED=true
      - SIGNATURE_WHITELISTED_ENDPOINTS=
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
       # Elasticsearch indexing
      - APP_CATALOG_ELASTICSEARCH_ENABLED=true
      - ES_HOSTS=http://elasticsearch:9200
      - APP_CATALOG_ELASTICSEARCH_INDEX_PREFIX=beckn-catalog
      - APP_CATALOG_ELASTICSEARCH_ALIAS_NAME=beckn-catalog
      - APP_CATALOG_ELASTICSEARCH_FAILURE_TOPIC=discovr.publish.es.failures
      - APP_CATALOG_ELASTICSEARCH_FINAL_DLQ_TOPIC=discovr.publish.es.dlt
      - APP_CATALOG_ELASTICSEARCH_BULK_BATCH_SIZE=100
      - APP_CATALOG_ELASTICSEARCH_RETRY_ATTEMPTS=3
      - APP_CATALOG_ELASTICSEARCH_RETRY_INITIAL_DELAY_MS=1000
      - APP_CATALOG_ELASTICSEARCH_POOL_SIZE=2
      - APP_CATALOG_ELASTICSEARCH_POOL_QUEUE_CAPACITY=200
      - APP_CATALOG_ELASTICSEARCH_MAX_FAILURE_ATTEMPTS=5
       # ES index mapping configuration
       # total-fields-limit: max number of fields per index (default 2000)
      - APP_CATALOG_ELASTICSEARCH_MAPPING_TOTAL_FIELDS_LIMIT=2000
       # depth-limit: max nesting depth for mappings (default 10)
      - APP_CATALOG_ELASTICSEARCH_MAPPING_DEPTH_LIMIT=10
       # template-file: path to a custom ES index template JSON file.
       # When set, the file is loaded instead of the built-in default template.
       # Use ${INDEX_PREFIX} placeholder in the file for the index prefix.
       # Mount via Docker volume, e.g.:
       #   volumes:
       #     - ./my-template.json:/config/es-template.json
       # Then set: ES_MAPPING_TEMPLATE_FILE=/config/es-template.json
      - ES_MAPPING_TEMPLATE_FILE=/config/es-index-template.json
      # ── Text Search Indexing ────────────────────────────────────────────────
      # Enable to generate and store item vectors in Elasticsearch.
      # Supports any OpenAI-compatible /v1/embeddings provider.
      # MUST use the same model as DISCOVERY_TEXT_SEARCH_EMBEDDING_NAME below.
      - CATALOG_TEXT_SEARCH_EMBEDDING_ENABLED=false
      - CATALOG_TEXT_SEARCH_EMBEDDING_NAME=text-embedding-3-small
      - CATALOG_TEXT_SEARCH_EMBEDDING_BASE_URL=https://api.openai.com
      - CATALOG_TEXT_SEARCH_EMBEDDING_API_KEY=
      - CATALOG_TEXT_SEARCH_EMBEDDING_TIMEOUT_MS=10000
      - CATALOG_TEXT_SEARCH_EMBEDDING_RETRIES=3
      - CATALOG_TEXT_SEARCH_EMBEDDING_RETRY_DELAY_MS=1000
      # ── Text Blob Size Cap ──────────────────────────────────────────────────
      # full_text_blob is truncated at a UTF-8 word boundary when it exceeds this
      # byte cap. When truncation fires, a WARN log is emitted:
      #   event=full.text.blob.truncated resourceId=<id> originalBytes=<n> truncatedBytes=<m>
      # Production default: 8192 (8 KB).
      - CATALOG_INDEXING_MAX_TEXT_BLOB_BYTES=8192
    volumes:
      - ./config/es-index-template.json:/config/es-index-template.json
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres-discovery:
        condition: service_healthy
      # ollama-init:
      #   condition: service_completed_successfully
    networks:
      - beckn-network
    restart: unless-stopped

  # ── Discovr Search ───────────────────────────────────────────────────────
  # Handles discover requests from Buyers (BAPs). Searches PostgreSQL + ES.
  catalog-discover-job:
    build:
      context: .
      dockerfile: jobs/catalog-discover-job/Dockerfile
    image: beckn/catalog-discover:1.0
    container_name: catalog-discover-job
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_REQUEST_TOPIC=discovr.discover.in.requests
      - KAFKA_RESPONSE_TOPIC=discovr.discover.out.responses
      - POSTGRES_HOST=postgres-discovery
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=catalog_db
      - POSTGRES_USERNAME=catalog_user
      - POSTGRES_PASSWORD=catalog123
      - POSTGRES_MAX_POOL_SIZE=10
      - MAX_ITEMS_PER_CATALOG=100
      - BECKN_PROTOCOL_API_SCHEMA_URL=https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/catalog-schema-changes/api/v2.0.0/beckn.yaml
      - SCHEMA_CACHE_TTL_HOURS=24
      - LOGGING_LEVEL_ORG_BECKN_DISCOVER=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=ERROR
      - LOGGING_LEVEL_ORG_APACHE_KAFKA=ERROR
      - OTEL_TRACES_EXPORTER=none
      # ── Onix integration — our BPP identity stamped onto on_discover responses ──
      - DISCOVERY_BPP_ID=
      - DISCOVERY_BPP_URI=
      # Beckn Auth SDK — signature verification for /beckn/discover
      - SIGNATURE_AUTH_ENABLED=true
      - SIGNATURE_REGISTRY_BASE_URL=https://fabric.nfh.global/registry/dedi/lookup
      - SIGNATURE_REGISTRY_NAME=subscribers.beckn.one
      - SIGNATURE_REGISTRY_TOKEN=
      - SIGNATURE_CLOCK_SKEW_SECONDS=30
      - SIGNATURE_CACHE_TTL_SECONDS=2592000
      - SIGNATURE_CACHE_MAX_KEYS=100
      - SIGNATURE_TIMEOUT_SECONDS=10
      - SIGNATURE_RETRY_ATTEMPTS=3
      # Whitelisted endpoints — comma-separated METHOD:PATH pairs that bypass signature verification
      # Paths are absolute URI paths (e.g. POST:/beckn/discover, GET:/beckn/discover)
      # Supports {param} and :param wildcards (e.g. GET:/beckn/discover/{id})
      # Leave empty to require auth on all endpoints when SIGNATURE_AUTH_ENABLED=true
      - SIGNATURE_WHITELISTED_ENDPOINTS=
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - JAVA_OPTS=-Xmx756m -Xms256m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # Elasticsearch text search + spatial
      - DISCOVERY_SPATIAL_ENGINE=elasticsearch
      - ES_HOSTS=http://elasticsearch:9200
      - ES_ALIAS=beckn-catalog
      - ES_RESULT_LIMIT=50
      - ES_MIN_SCORE=0.68
      - ES_TIE_BREAKER=0.3
      - ES_FUZZINESS=AUTO
      - ES_CONNECT_TIMEOUT_MS=5000
      - ES_SOCKET_TIMEOUT_MS=30000
      # Per-query timeout (seconds) for the single-path engines — cases B/C/D and the
      # case-4 J+G combined query. Maps to discovery.parallel-query-timeout-seconds.
      # This is NOT a chain setting; the ES->PSQL chain has its own end-to-end budget
      # in DISCOVERY_CHAIN_TIMEOUT_SECONDS below.
      - DISCOVERY_PARALLEL_QUERY_TIMEOUT_SECONDS=10
      # ── ES-text -> PSQL-JSONPath chain (cases J+T and J+G+T) ─────────────────
      # The chain only runs when DISCOVERY_SPATIAL_ENGINE=elasticsearch (above) so
      # the ES engine bean exists; otherwise J+T / J+G+T drop the text term and run
      # as J / J+G. ES candidate pool = min(result-limit * overfetch-factor, max-ids).
      - DISCOVERY_CHAIN_OVERFETCH_FACTOR=10
      - DISCOVERY_CHAIN_MAX_IDS=5000
      # End-to-end chain timeout in seconds (ES step 1 + PSQL step 2). Absolute
      # value; 20 ~= 2x DISCOVERY_PARALLEL_QUERY_TIMEOUT_SECONDS (two sequential calls).
      - DISCOVERY_CHAIN_TIMEOUT_SECONDS=20
      # ── Text Search ─────────────────────────────────────────────────────────
      # Engine options: native-els | els-semantic-search | nlweb
      # native-els        — keyword BM25, no AI dependency (default)
      # els-semantic-search — vector knn via Elasticsearch + optional LLM enrichment
      #                       requires embedding-model and llm-model config below
      # nlweb             — delegates to an external NLWeb service
      - DISCOVERY_FILTER_DISCARD_CATALOGS_WITHOUT_OFFERS=true
      - DISCOVERY_TEXT_SEARCH_ENGINE=native-els
      # ── Embedding model (required when engine=els-semantic-search) ───────────
      # Supports any OpenAI-compatible /v1/embeddings provider.
      # MUST match CATALOG_TEXT_SEARCH_EMBEDDING_NAME — same model both sides.
      # If engine != els-semantic-search, these values are ignored.
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_NAME=text-embedding-3-small
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_BASE_URL=https://api.openai.com
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_API_KEY=
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_TIMEOUT_MS=10000
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_KNN_CANDIDATES=500
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_RETRIES=3
      - DISCOVERY_TEXT_SEARCH_EMBEDDING_RETRY_DELAY_MS=1000
      # ── LLM query enrichment (optional, used only when engine=els-semantic-search) ──
      # Expands query with synonyms and domain vocabulary before embedding.
      # Set LLM_ENABLED=false to skip enrichment and embed the raw query directly.
      # Supports any OpenAI-compatible /v1/chat/completions provider (OpenAI, Groq, Azure, etc.).
      # If engine != els-semantic-search, these values are ignored.
      - DISCOVERY_TEXT_SEARCH_LLM_ENABLED=false
      - DISCOVERY_TEXT_SEARCH_LLM_NAME=gpt-4o-mini
      - DISCOVERY_TEXT_SEARCH_LLM_BASE_URL=https://api.openai.com
      - DISCOVERY_TEXT_SEARCH_LLM_API_KEY=
      - DISCOVERY_TEXT_SEARCH_LLM_TIMEOUT_MS=30000
      - DISCOVERY_TEXT_SEARCH_LLM_RETRIES=3
      - DISCOVERY_TEXT_SEARCH_LLM_RETRY_DELAY_MS=1000
      - DISCOVERY_TEXT_SEARCH_LLM_TEMPERATURE=0.0
      - DISCOVERY_TEXT_SEARCH_LLM_SYSTEM_PROMPT=You are a product catalog search assistant. Preserve every word of the user query exactly as given including brand names. Only append 1-2 product synonyms if the query is purely generic like a category name. If the query contains any brand name or specific product term return it completely unchanged. Never add process terms or loosely related categories. Return only the final query as a single line with no explanation.
    depends_on:
      postgres-discovery:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      # ollama-init:
      #   condition: service_completed_successfully
    networks:
      - beckn-network
    restart: unless-stopped
    # No healthcheck — the DHI distroless runtime has no shell/bash/curl.
    # Liveness/readiness is handled by the orchestrator (k8s httpGet probes);
    # local compose dependents gate on service_started instead.

  # ── Discovr Dispatcher ──────────────────────────────────────────────────
  # Delivers on_discover callbacks to Buyers (BAPs); failures go to DLT topic.
  response-dispatcher:
    build:
      context: .
      dockerfile: jobs/response-dispatcher/Dockerfile
    image: beckn/response-dispatcher:1.0
    container_name: response-dispatcher
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TOPICS_INPUT=discovr.discover.out.responses
      - TOPICS_DLT=discovr.dispatcher.dlt.responses
      - SPRING_KAFKA_CONSUMER_GROUP_ID=seeker-notifier-group
      - SPRING_KAFKA_LISTENER_CONCURRENCY=1
      # DeDi Registry — callback URL resolution (resolves subscriber base URL at delivery time)
      - REGISTRY_BASE_URL=https://fabric.nfh.global/registry/dedi/lookup
      - REGISTRY_NAME=subscribers.beckn.one
      # Beckn HTTP Signature — outgoing signing for on_discover callbacks to BAP
      # Set SIGNING_ENABLED=true and provide key details to sign outbound callbacks
      - SIGNING_ENABLED=true
      - SIGNING_SUBSCRIBER_ID=${SIGNING_SUBSCRIBER_ID:-}
      - SIGNING_KEY_ID_SUFFIX=${SIGNING_KEY_ID_SUFFIX:-}
      - SIGNING_PRIVATE_KEY=${SIGNING_PRIVATE_KEY:-}
      - SIGNING_EXPIRY_SECONDS=3600
      # ── Static callback routing — when enabled, dispatcher posts every callback
      # to STATIC_CALLBACK_URL (typically Onix-discover/caller) instead of resolving
      # via DeDi. Onix-discover/caller signs and forwards to the BAP.
      - STATIC_CALLBACK_ENABLED=false
      - STATIC_CALLBACK_URL=http://onix-discover:8083/caller
      # SSRF validation — disable for local/Docker development (no public DNS)
      - CALLBACK_URL_VALIDATION_ENABLED=false
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      catalog-discover-job:
        # service_started (not service_healthy): the discover-job's distroless
        # runtime has no in-container healthcheck; gate on container start.
        condition: service_started
    networks:
      - beckn-network
    restart: unless-stopped
    # No healthcheck — the DHI distroless runtime has no shell/curl.
    # Liveness/readiness is handled by the orchestrator (k8s httpGet probes).

volumes:
  postgres_discovery_data:
    driver: local
  elasticsearch_data:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  beckn-network:
    external: true
