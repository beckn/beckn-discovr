# Path-split production SLO targets for the 100M / 12k TPM simulation suite.
# Staging baseline SLOs remain in slos.yaml (Phase-1 scenarios 03–13).
# Source: Agent Store docs/simulation-harness-design.md §6
#         + docs/corpus-ladder-simulation.md (1M→10M→50M→100M)
#         + scalability-100m-architecture.md §2.3
#
# Corpus ladder profiles are the scorecard columns. S1 is optional isolation.

sim:
  id_prefix: "S"
  corpus_profiles: ["local-smoke", "1M", "10M", "50M", "100M"]
  # 15M is a legacy alias only — not a scorecard column
  corpus_profiles_legacy: ["15M", "100M-subset"]

# ─── S1 — ACK-only (auth + schema + Kafka produce) ───────────────────────────
S1:
  ack:
    cache_hit_p99_ms: 100
    cache_miss_p99_ms: 250
    error_rate_max: 0.001
  kafka:
    produce_p99_ms: 20
  ramp:
    avg_qps: 200
    peak_qps: 600
    optional_stress_qps: [1000, 2000]
    sustain_min_per_step: 10

# ─── S2 — Kafka-in (stub metrics; driver follow-on) ───────────────────────────
S2:
  kafka:
    lag_sustained_max: 1000
    lag_peak_max: 10000
  engine:
    pg_p99_ms: 150
    es_bm25_p99_ms: 200
    chain_p99_ms: 400

# ─── S3 — Query engine / headline discover against corpus ────────────────────
S3:
  engine:
    pg_p99_ms: 150              # J / G / J+G (PostGIS + JSONPath)
    es_bm25_p99_ms: 200         # T-keyword
    chain_p99_ms: 400
  ramp:
    avg_qps: 200
    peak_qps: 600
    sustain_min_per_step: 10
  require_corpus_verified: true

# ─── S4 — Dispatcher → onix (stub; driver follow-on) ──────────────────────────
S4:
  callback_http_p99_ms: 500
  success_rate_min: 0.999

# ─── S5 — Full e2e headline against corpus ───────────────────────────────────
S5:
  e2e_headline_p99_ms: 1500     # stretch 1000
  e2e_headline_stretch_p99_ms: 1000
  e2e_chain_p99_ms: 2000
  callback_success_rate_min: 0.999
  kafka:
    lag_sustained_max: 1000
  require_corpus_verified: true
  ramp:
    avg_qps: 200
    peak_qps: 600

# ─── S6 — Publish → searchable ───────────────────────────────────────────────
S6:
  push_to_searchable_p99_ms_min: 2000
  push_to_searchable_p99_ms_max: 5000
  es_bulk_reject_rate_max: 0.0
  require_corpus_verified: true
