# Default SLOs applied when a scenario does not override.
# All values are starting points — tune after the first baseline run.

push_receive:
  latency_p50_ms: 100
  latency_p95_ms: 300
  latency_p99_ms: 500
  error_rate_max: 0.001

indexing:
  pg_write_lag_p99_ms: 200
  es_index_lag_p99_ms: 500
  push_to_searchable_p99_ms: 2000     # push received → catalog appears in discover results
  bulk_indexer_reject_rate_max: 0.0   # ES bulk indexer must accept all

discover_ack:
  latency_p50_ms: 50
  latency_p95_ms: 150
  latency_p99_ms: 300
  error_rate_max: 0.001

on_discover:
  e2e_p50_ms: 500                     # discover ACK → on_discover received
  e2e_p95_ms: 1500
  e2e_p99_ms: 3000
  success_rate_min: 0.999

external_enrichment:
  call_p99_ms: 800                    # we don't own this, but track it
  timeout_ms: 5000                    # if the external API exceeds this, on_discover proceeds with a fallback (verify)

kafka:
  consumer_lag_sustained_max: 1000
  consumer_lag_peak_max: 10000

jvm:
  heap_used_pct_max: 80
  gc_pause_p99_ms_max: 500
  thread_count_growth_max_per_hour: 10

postgres:
  connection_pool_used_pct_max: 80
  query_p99_ms_max: 200

elasticsearch:
  query_p99_ms_max: 500
  heap_used_pct_max: 75
  bulk_queue_full_count_max: 0

soak:
  duration_hours_default: 4
  heap_drift_pct_per_hour_max: 5
  log_error_rate_max_per_minute: 10
